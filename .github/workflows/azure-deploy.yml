name: Build and Deploy Java 17 Application

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  AZURE_WEBAPP_NAME: 'YOUR-AZURE-APP-NAME'

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # 3. Verify Java and Maven
      - name: Verify Java and Maven
        run: |
          echo "=============================="
          echo "JAVA VERSION"
          echo "=============================="
          java -version

          echo "=============================="
          echo "MAVEN VERSION"
          echo "=============================="
          mvn -version

      # 4. Build Spring Boot application
      - name: Build Application
        run: |
          mvn clean package -DskipTests

      # 5. Verify generated JAR
      - name: Check Build Files
        run: |
          echo "=============================="
          echo "TARGET DIRECTORY"
          echo "=============================="
          ls -lah target/

          echo "=============================="
          echo "JAR FILES"
          echo "=============================="
          find target -maxdepth 1 -name "*.jar" -type f

      # 6. Upload JAR as GitHub Actions artifact
      - name: Upload Application
        uses: actions/upload-artifact@v4
        with:
          name: java17-app
          path: target/*.jar


  deploy:

    runs-on: ubuntu-latest

    needs: build

    steps:

      # 7. Download the JAR
      - name: Download Application
        uses: actions/download-artifact@v4
        with:
          name: java17-app
          path: ./target

      # 8. Verify downloaded JAR
      - name: Check Deployment Files
        run: |
          echo "=============================="
          echo "DEPLOYMENT FILES"
          echo "=============================="
          ls -lah ./target

          echo "=============================="
          echo "JAR FILE"
          echo "=============================="
          find ./target -name "*.jar" -type f

      # 9. Login to Azure using OIDC
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_958B4B249B964642B079E31130282A47 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_71AA272BA9994AE48183988A2C7B5618 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2AAAAB2D191C493C99DCC94BF847E0D1 }}

      # 10. Deploy JAR to Azure App Service
      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./target/*.jar

      # 11. Deployment completed
      - name: Deployment Complete
        run: |
          echo "=============================="
          echo "DEPLOYMENT COMPLETED"
          echo "=============================="
          echo "Application:"
          echo "https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
